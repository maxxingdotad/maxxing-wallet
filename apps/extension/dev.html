    <style>
      /* Development only: the popup at its real size, centred, like it sits under the toolbar. */

      .dev-bar b { color: #fff; font-weight: 600; }
      .dev-bar a { color: #c9b6ff; text-decoration: none; }
      body[data-mode="tab"] .dev-bar { position: fixed; z-index: 50; top: 8px; right: 12px; align-items: flex-end; }
      .dev-frame { width: 360px; height: 600px; position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 0 0 1px #2a2a2e, 0 30px 80px rgb(0 0 0 / .6); }
