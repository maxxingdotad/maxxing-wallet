<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Test dapp</title>
<style>body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:24px}pre{white-space:pre-wrap;font-size:12px;background:#000;padding:8px}</style></head>
<body>
<h1>Test dapp</h1>
<p>Used by scripts/e2e.mjs to drive the MAXXING Wallet extension the way a site would: EIP-6963 for EVM, the Wallet Standard for Solana.</p>
<pre id="log"></pre>
<script>
  // EIP-6963: find the MAXXING provider by its announcement, not by window.ethereum.
  window.found = { evm: null, solana: null };
  window.addEventListener("eip6963:announceProvider", e => { if (e.detail?.info?.rdns === "ad.maxxing.wallet") window.found.evm = e.detail.provider; });
  window.dispatchEvent(new Event("eip6963:requestProvider"));
  // Wallet Standard: register as an app and collect wallets.
  const api = { register: (...wallets) => { for (const w of wallets) if (w.name === "MAXXING Wallet") window.found.solana = w; return () => {}; } };
  window.addEventListener("wallet-standard:register-wallet", e => e.detail(api));
  window.dispatchEvent(Object.assign(new Event("wallet-standard:app-ready"), { detail: api }));
  window.results = {};
  window.run = (name, promise) => { window.results[name] = { pending: true }; Promise.resolve(promise).then(value => { window.results[name] = { ok: true, value }; document.getElementById("log").textContent += `${name}: ok\n`; }, error => { window.results[name] = { ok: false, error: String(error?.message ?? error), code: error?.code }; document.getElementById("log").textContent += `${name}: ${error?.message}\n`; }); };
  // A legacy Solana transfer, built by hand (no libraries on this page).
  window.solTransfer = (from, to) => {
    const alphabet = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
    const decode = s => { let n = 0n; for (const c of s) n = n * 58n + BigInt(alphabet.indexOf(c)); const out = []; while (n > 0n) { out.unshift(Number(n % 256n)); n /= 256n; } for (const c of s) { if (c === "1") out.unshift(0); else break; } while (out.length < 32) out.unshift(0); return out; };
    const lamports = [0x40, 0x42, 0x0f, 0, 0, 0, 0, 0]; // 1,000,000 lamports
    const message = [1, 0, 1, 3, ...decode(from), ...decode(to), ...new Array(32).fill(0), ...new Array(32).fill(1), 1, 2, 2, 0, 1, 12, 2, 0, 0, 0, ...lamports];
    return new Uint8Array([1, ...new Array(64).fill(0), ...message]);
  };
</script>
</body>
</html>
