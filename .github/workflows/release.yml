# Publishes @maxxing/wallet-sdk to npm from this repository with provenance, so the npm page links the commit and the run that
# built it. A release starts when a tag named after the version is pushed, for example sdk-v0.2.2.
# npm trusts this workflow through Trusted Publishing (OpenID Connect), so no npm token is stored anywhere.
name: Release SDK

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      # Each action is pinned to the commit behind its version tag, so a moved tag can't change what builds a release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Tag matches the package version
        run: |
          version=$(node -p "require('./packages/sdk/package.json').version")
          test "sdk-v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }
      - run: pnpm --filter @maxxing/wallet-sdk typecheck
      - run: pnpm --filter @maxxing/wallet-sdk test
      - run: pnpm --filter @maxxing/wallet-sdk build
      # pnpm pack applies publishConfig (the dist entry points); npm publishes the packed file with provenance.
      - run: pnpm pack --pack-destination ../..
        working-directory: packages/sdk
      - run: npm publish ./maxxing-wallet-sdk-*.tgz --provenance --access public
